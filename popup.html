<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wait 24h</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <svg class="mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b9588"/><stop offset="1" stop-color="#0b5e57"/></linearGradient></defs>
      <rect width="32" height="32" rx="8" fill="url(#mk)"/>
      <path d="M9 6.5h14a1 1 0 0 1 0 2h-1c0 4.2-2.6 6.2-4.6 7.5 2 1.300 4.600 3.300 4.600 7.500h1a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h1c0-4.200 2.600-6.200 4.600-7.500C12.600 14.700 10 12.700 10 8.500H9a1 1 0 0 1 0-2z" fill="#fff8ec"/>
      <path d="M12 23.500c.5-1.800 2-2.800 4-4 2 1.200 3.500 2.200 4 4z" fill="#f4b740"/>
      <path d="M13.200 9c.4 1.500 1.300 2.300 2.800 3.200 1.500-.9 2.400-1.700 2.800-3.200z" fill="#f4b740"/>
    </svg>
    <h1>Wait 24h</h1>
    <span id="supporter" class="badge" hidden>Supporter ❤</span>
    <a id="optionsLink" class="gear" href="options.html" target="_blank" aria-label="Options" title="Options">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.900l.1.100a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.900-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.900.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.900 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.900l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.700 1.700 0 0 0 1.900.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.900-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0-.3 1.900V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>
    </a>
  </header>

  <section id="banner" class="banner" hidden>
    <button id="banner-close" class="x" type="button" aria-label="Dismiss">×</button>
    <div class="banner-head">
      <svg class="cup" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V9z"/><path d="M17 10h1.500a2.500 2.500 0 0 1 0 5H17"/><path d="M9 3v2M13 3v2"/></svg>
      <p id="banner-text"></p>
    </div>
    <div id="banner-buttons" class="donate-row"></div>
    <p id="banner-note" class="note"></p>
    <a id="banner-never" href="#" class="small-link">Don't ask again</a>
  </section>

  <section class="hero">
    <div class="label">You've kept</div>
    <div id="total" class="big">–</div>
    <div id="others" class="others"></div>
  </section>

  <section class="stats">
    <div class="tile">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>
      <strong id="skipped">0</strong><span>items skipped</span>
    </div>
    <div class="tile">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 6 2.500 7.500 2.500 7.500h-17S6 14 6 8z"/><path d="M10 19.500a2 2 0 0 0 4 0"/></svg>
      <strong id="pendingCount">0</strong><span>pending reminders</span>
    </div>
  </section>

  <section id="pendingSection">
    <h2>Waiting for your decision</h2>
    <ul id="pendingList" class="pending"></ul>
    <div id="pendingEmpty" class="empty">
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <circle cx="32" cy="32" r="28" fill="var(--accent-soft)"/>
        <path d="M22 17h20a1.500 1.500 0 0 1 0 3h-1.500c0 6-4 9-8.500 12 4.500 3 8.500 6 8.500 12H42a1.500 1.500 0 0 1 0 3H22a1.500 1.500 0 0 1 0-3h1.500c0-6 4-9 8.500-12-4.500-3-8.500-6-8.500-12H22a1.500 1.500 0 0 1 0-3z" fill="none" stroke="var(--accent)" stroke-width="2.200" stroke-linejoin="round"/>
        <path d="M26.500 43c1-3 3-4.500 5.500-6 2.500 1.500 4.500 3 5.500 6z" fill="var(--accent)" opacity=".55"/>
      </svg>
      <p>Nothing waiting. Nice and calm.</p>
    </div>
  </section>

  <section id="recentSection" hidden>
    <h2>Recent wins</h2>
    <ul id="recentList" class="recent"></ul>
  </section>

  <section class="pause">
    <label class="switch">
      <input id="pause" type="checkbox" role="switch">
      <span class="track" aria-hidden="true"></span>
      <span class="switch-text">Pause for 1 hour</span>
    </label>
    <span id="pauseLeft" class="note" aria-live="polite"></span>
  </section>

  <script src="lib/donation.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
