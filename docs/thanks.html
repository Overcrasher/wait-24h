<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Wait 24h</title>
<style>
:root{color-scheme:light dark;--bg:#f7f3ec;--surface:#fffdf9;--line:#e6dfd2;--fg:#23282a;--muted:#5f6663;--accent:#0f766e;--accent-soft:#dcefea;--shadow:0 1px 2px rgba(60,45,20,.06),0 8px 30px rgba(60,45,20,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#141a19;--surface:#1c2423;--line:#2e3b39;--fg:#edf1ee;--muted:#a3b0ac;--accent:#5fd1b8;--accent-soft:#1f3a36;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.3)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mark{filter:drop-shadow(0 3px 6px rgba(11,94,87,.3))}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:17px}
.card{background:radial-gradient(120% 100% at 50% 0%,var(--accent-soft),var(--surface) 65%);border:1px solid var(--line);max-width:460px;margin:16px;padding:36px 32px;border-radius:24px;text-align:center;box-shadow:var(--shadow)}
.heart{font-size:44px;color:var(--accent);line-height:1;margin-top:14px}
h1{margin:10px 0 12px;font-size:28px;letter-spacing:-.01em}p{color:var(--muted);margin:8px 0}
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b9588"/><stop offset="1" stop-color="#0b5e57"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#mk)"/><path d="M9 6.5h14a1 1 0 0 1 0 2h-1c0 4.2-2.6 6.2-4.6 7.5 2 1.3 4.6 3.3 4.6 7.5h1a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h1c0-4.2 2.6-6.2 4.6-7.5C12.6 14.7 10 12.7 10 8.5H9a1 1 0 0 1 0-2z" fill="#fff8ec"/><path d="M12 23.5c.5-1.8 2-2.8 4-4 2 1.2 3.5 2.2 4 4z" fill="#f4b740"/><path d="M13.2 9c.4 1.5 1.3 2.3 2.8 3.2 1.500-.9 2.4-1.7 2.8-3.200z" fill="#f4b740"/></svg>
    <div class="heart" aria-hidden="true">❤</div>
    <h1>Thank you!</h1>
    <p>Your support keeps Wait 24h free, ad-free and tracking-free.</p>
    <p>If the extension is installed, it will now show a small "Supporter ❤" badge and stop asking.</p>
    <p>Go and enjoy the money you did not spend.</p>
  </main>
</body>
</html>
