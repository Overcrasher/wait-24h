<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Wait 24h</title>
<style>
  :root { --bg:#f6f7fb; --fg:#1f2430; --muted:#6a7186; --card:#fff; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161f; --fg:#eceef7; --muted:#a3a9bd; --card:#1e2230; --accent:#a5b4fc; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { background:var(--card); max-width:460px; margin:16px; padding:36px 32px; border-radius:20px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.12); }
  .heart { font-size:48px; color:var(--accent); }
  h1 { margin:8px 0 12px; font-size:26px; } p { color:var(--muted); margin:8px 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">❤</div>
    <h1>Thank you!</h1>
    <p>Your support keeps Wait 24h free, ad-free and tracking-free.</p>
    <p>If the extension is installed, it will now show a small "Supporter ❤" badge and stop asking.</p>
    <p>Go and enjoy the money you did not spend.</p>
  </main>
</body>
</html>
